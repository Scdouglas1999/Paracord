[package]
name = "paracord-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
# QUIC
quinn = { workspace = true }
# `RttEstimator` for the media congestion controller (congestion.rs); the same
# quinn-proto quinn already builds on.
quinn-proto = "0.11"
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
rustls = { workspace = true }

# Workspace crates
paracord-models = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }

# Crypto / TLS
rcgen = { workspace = true }
time = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrent collections
dashmap = { workspace = true }

# Bytes
bytes = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Independently parses generated certificates so the validity-window test
# asserts against the DER that actually goes on the wire, not against the
# parameters we asked rcgen for. Test-only: it is not linked into the server.
x509-parser = { workspace = true }
# The congestion-control lab example (examples/cc_lab.rs) prints the
# controller's own log lines.
tracing-subscriber = { workspace = true }
