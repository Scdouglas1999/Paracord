[package]
name = "paracord-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "paracord-server"
path = "src/main.rs"

[dependencies]
paracord-api = { workspace = true }
paracord-ws = { workspace = true }
paracord-core = { workspace = true, features = ["backup"] }
paracord-db = { workspace = true }
paracord-federation = { workspace = true }
paracord-models = { workspace = true }
paracord-util = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
paracord-media = { workspace = true }
paracord-relay = { workspace = true }
paracord-transport = { workspace = true }
quinn = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
which = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
moka = { workspace = true }
dashmap = { workspace = true }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

[features]
default = ["embed-ui"]
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
s3 = ["paracord-media/s3"]
