[package]
name = "paracord-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "paracord-server"
path = "src/main.rs"

# The desktop app's background server (docs/setup-spec.md §2.1): the same
# program, built as a Windows GUI-subsystem binary so Task Scheduler does not
# open a console window. Its source file includes `main.rs`, so there is one
# program and one set of modules. `test = false`: main.rs's tests already run
# under paracord-server.
[[bin]]
name = "paracord-host"
path = "src/bin/paracord-host.rs"
test = false

[lints.clippy]
# Were `#![allow]`s at the top of main.rs; main.rs is also included by
# src/bin/paracord-host.rs, where an inner attribute is not allowed.
collapsible_if = "allow"
derivable_impls = "allow"

[dependencies]
paracord-api = { workspace = true }
paracord-ws = { workspace = true }
paracord-core = { workspace = true, features = ["backup"] }
paracord-db = { workspace = true }
paracord-federation = { workspace = true }
paracord-models = { workspace = true }
paracord-util = { workspace = true }
paracord-contracts = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
paracord-media = { workspace = true }
paracord-relay = { workspace = true }
paracord-transport = { workspace = true }
quinn = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
# `escrow-key`: the owner's public key from the recovery phrase (spec §4.8).
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
igd-next = { workspace = true }
crab_nat = { workspace = true }
which = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
rcgen = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
moka = { workspace = true }
dashmap = { workspace = true }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
uuid = { workspace = true }
# encrypt-storage drives SQLCipher on single connections (ATTACH, sqlcipher_export).
sqlx = { workspace = true }

# The at-rest storage key in the OS credential store (setup spec §4.2). The
# same platform stores as the desktop app (client/src-tauri/Cargo.toml):
# `keyring` with no platform feature silently falls back to an in-process mock
# store, so every target names its real one, and `at_rest_boot` proves a
# write/read/delete roundtrip through fresh entries before it trusts one.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
# geteuid(), for the key file's owner check.
libc = "0.2"

[features]
default = ["embed-ui"]
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
s3 = ["paracord-media/s3"]
