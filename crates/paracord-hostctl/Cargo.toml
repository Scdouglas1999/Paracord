[package]
name = "paracord-hostctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Paracord on this computer: installs and supervises the desktop app's background server (docs/setup-spec.md §2)"

[dependencies]
paracord-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
# Loopback calls to the hosted server. Blocking: every hostctl operation runs on
# a worker thread (the Tauri commands use spawn_blocking), and the polling in
# setup and update is plain sleeps.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# The pinned verifier for the host's own certificate (same major and provider
# as reqwest's rustls, so use_preconfigured_tls accepts the config).
rustls = { workspace = true, features = ["std", "tls12", "logging"] }
# Reading a picked backup's manifest for the restore screen (spec §4.8).
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The keychain probe (spec §2.3). `keyring` with no platform feature silently
# uses an in-process mock store whose writes always succeed, so every target
# names its real store, exactly as client/src-tauri and paracord-server do.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }
