<!doctype html>
<!--
  The README banner, the README's animated mark and the bare wordmark, composed
  from the mark.html art (render.mjs draws that first). Views, by URL hash:
    view=banner                 mark + "Paracord" on the tile's warm-dark ground
    view=banner&ground=light    the same on a light ground
    view=wordmark               "Paracord" alone, transparent, for the loading screen
    view=anim                   the mark above "Paracord", for the README's animation;
                                render.mjs fills in the animated mark and steps it
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/gabarito/800.css">
<style>
  body { margin: 0; background: transparent; }
  #art { position: relative; overflow: hidden; }
  .word { font: 800 150px/1 Gabarito, sans-serif; letter-spacing: -0.045em; color: #f4f5f6; }
  .ground { background: linear-gradient(160deg, #2b2420, #131214); }
  .glow { position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 184, 119, .16), rgba(255, 160, 80, .05) 40%, transparent 68%); }

  .banner { width: 1280px; height: 400px; display: flex; align-items: center; justify-content: center; gap: 40px; }
  .banner .glow { left: 470px; top: 200px; width: 760px; height: 760px; }
  .banner img { position: relative; width: 236px; height: 236px; }
  .banner .word { position: relative; padding-bottom: 14px; }
  .banner.light { background: linear-gradient(180deg, #f7f4ee 0%, #efe9df 100%); }
  .banner.light .glow { background: radial-gradient(circle, rgba(255, 170, 96, .20), rgba(255, 170, 80, .06) 40%, transparent 68%); }
  .banner.light .word { color: #14181c; }

  .wordmark { display: inline-block; padding: 24px 32px; }

  .anim { width: 640px; height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .anim .glow { left: 320px; top: 200px; width: 640px; height: 640px; }
  .anim .mark { position: relative; width: 236px; height: 236px; margin-top: 8px; }
  .anim .mark svg { width: 100%; height: 100%; display: block; }
  .anim .word { position: relative; font-size: 74px; }
  .anim .word { animation: word 420ms cubic-bezier(0.16, 1, 0.3, 1) 760ms backwards; }
  @keyframes word { from { opacity: 0; filter: blur(8px); transform: scale(1.04); } }
</style>
</head>
<body>
<div id="art"></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const art = document.getElementById('art');
const view = P.get('view') || 'banner';
if (view === 'wordmark') {
  art.className = 'wordmark';
  art.innerHTML = '<div class="word">Paracord</div>';
} else if (view === 'anim') {
  art.className = 'anim ground';
  art.innerHTML = '<div class="glow"></div><div class="mark" id="mark"></div><div class="word">Paracord</div>';
} else {
  const light = P.get('ground') === 'light';
  art.className = `banner ${light ? 'light' : 'ground'}`;
  art.innerHTML = '<div class="glow"></div><img src="../public/brand/cord-full.svg" alt=""><div class="word">Paracord</div>';
}
Promise.all([
  document.fonts.load('800 150px Gabarito'),
  ...[...art.querySelectorAll('img')].map((img) => img.decode()),
]).then(() => { window.DONE = true; });
</script>
</body>
</html>
