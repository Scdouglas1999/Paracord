<!doctype html>
<!--
  Paracord's mark, "Thread": a single paracord looped into a P. A straight stem,
  a round bowl, and the bowl's end threaded under the stem and out the other
  side as a short tail. Drawn as real paracord: a braided sheath (staggered
  chevron cells in two lanes), darker edges, and fused ends (a smooth cap a
  little darker than the cord, with a thin ring where the braid stops).

  This file is the source of truth. It draws every variant as SVG, procedurally,
  and render.mjs turns those into every icon, the in-app art, the loading
  screen's art and the animation data. Open it in a browser to see the variants.

  window.PCMark exposes:
    GEO                       the shared geometry (see `geometry()` below)
    art(level, part)          an SVG document of the bare mark
                              level: full | mid | flat | mono
                              part:  whole | under (the bowl's second half and the
                                     tail alone, for the drawing animation)
    tile(level, {square})     the mark on the app-icon tile, 1024 units
    free(level, fill)         the bare mark, transparent, filling `fill` of the box
-->
<html>
<head>
<meta charset="utf-8">
<title>Paracord mark</title>
<style>
  body { margin: 0; background: #141518; color: #e8e8ea; font: 13px/1.4 system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-end; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  figure.light { background: #f1ede6; color: #17181b; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<div class="row" id="preview"></div>
<script>
(function () {
  // ------------------------------------------------------------------ palette
  const COLORS = {
    // Ember: the approved colorway.
    ember: { base: '#ffb877', cellA: '#ec9550', cellB: '#f09d59', edge: '#d78340', melt: '#d98a4c', ring: '#bd6f31' },
    // Tray and other single-color uses: flat, one light color.
    mono: { base: '#e8e8ea', cellA: '#e8e8ea', cellB: '#e8e8ea', edge: '#e8e8ea', melt: '#e8e8ea', ring: '#e8e8ea' },
  };
  const TILE = { from: '#2b2420', to: '#131214', ground: '#1f1b19' };
  // Cord width by level. The centerline is the same for every level; the flat
  // drawing (16-20 px) uses a thicker cord so it holds up at tab and tray size.
  const WIDTH = { full: 14, mid: 14, flat: 16, mono: 16 };
  const LEVEL_STYLE = { full: 'full', mid: 'mid', flat: 'flat', mono: 'flat' };

  // ----------------------------------------------------------------- geometry
  const lens = (pl) => { const L = [0]; for (let i = 1; i < pl.length; i++) L.push(L[i - 1] + Math.hypot(pl[i][0] - pl[i - 1][0], pl[i][1] - pl[i - 1][1])); return L; };
  function at(pl, L, s) { // point and unit tangent at arc length s
    s = Math.max(0, Math.min(L[L.length - 1], s)); let i = 1; while (i < L.length - 1 && L[i] < s) i++;
    const f = (s - L[i - 1]) / ((L[i] - L[i - 1]) || 1), a = pl[i - 1], b = pl[i];
    const dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
    return { p: [a[0] + dx * f, a[1] + dy * f], t: [dx / m, dy / m] };
  }
  // A cord loop: a circle whose two ends leave on tangents and cross at X.
  function loop({ cx = 56, cy = 42, R = 24, phi = 130, cross = 80, l1 = 15, l2 = 24 }) {
    const r = Math.PI / 180, d = R / Math.sin(cross / 2 * r), al = Math.acos(R / d) / r;
    const X = [cx + d * Math.cos(phi * r), cy + d * Math.sin(phi * r)];
    const T = (a) => [cx + R * Math.cos(a * r), cy + R * Math.sin(a * r)];
    const a1 = phi + al, a2 = phi - al + 360, T1 = T(a1), T2 = T(a2);
    const u = (A, B) => { const dx = B[0] - A[0], dy = B[1] - A[1], m = Math.hypot(dx, dy); return [dx / m, dy / m]; };
    const uA = u(T1, X), uB = u(T2, X);
    const E1 = [X[0] + uA[0] * l1, X[1] + uA[1] * l1], E2 = [X[0] + uB[0] * l2, X[1] + uB[1] * l2];
    const line = (A, B, n) => Array.from({ length: n }, (_, k) => [A[0] + (B[0] - A[0]) * k / n, A[1] + (B[1] - A[1]) * k / n]);
    const arc = []; const n = Math.ceil((a2 - a1) / 2); for (let k = 0; k <= n; k++) arc.push(T(a1 + (a2 - a1) * k / n));
    return [...line(E1, X, 20), ...line(X, T1, 30), ...arc, ...line(T2, X, 30).slice(1), ...line(X, E2, 20), E2];
  }
  // The approved proportions: loopMark({phi:130,cross:80,l1:15,l2:24,R:24}).
  const PL = loop({ phi: 130, cross: 80, l1: 15, l2: 24, R: 24 });
  const LL = lens(PL), TOT = LL[LL.length - 1];
  // Where the cord crosses itself: sa on the stem (over), sb on the tail (under).
  const CROSS = (() => {
    for (let i = 1; i < PL.length; i++) for (let j = i + 2; j < PL.length; j++) {
      const a = PL[i - 1], b = PL[i], q = PL[j - 1], r = PL[j];
      const rx = b[0] - a[0], ry = b[1] - a[1], sx = r[0] - q[0], sy = r[1] - q[1], den = rx * sy - ry * sx;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((q[0] - a[0]) * sy - (q[1] - a[1]) * sx) / den, u = ((q[0] - a[0]) * ry - (q[1] - a[1]) * rx) / den;
      if (t < 0 || t > 1 || u < 0 || u > 1) continue;
      const sa = LL[i - 1] + (LL[i] - LL[i - 1]) * t, sb = LL[j - 1] + (LL[j] - LL[j - 1]) * u;
      if (Math.abs(sa - sb) < 42) continue;
      return { sa, sb };
    }
    throw new Error('the mark has no crossing');
  })();
  // The two halves the drawing animation reveals separately: the stem and the
  // bowl's first half (over), then the bowl's second half and the tail (under).
  const S_MID = (CROSS.sa + CROSS.sb) / 2;
  // The stretch of stem whose surroundings are cut away from the under strand,
  // leaving the transparent gap on both sides of the stem.
  const HALO_HI = CROSS.sa + 1.75 * 16;
  const GAP = (w) => w * 0.3;

  const D = (pl) => pl.length ? 'M' + pl.map((p) => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') : '';
  function sample(s0, s1, o, step = 0.6) {
    const n = Math.max(2, Math.ceil(Math.abs(s1 - s0) / step)), out = [];
    for (let k = 0; k <= n; k++) { const s = s0 + (s1 - s0) * k / n, { p, t } = at(PL, LL, s); out.push([p[0] - t[1] * o, p[1] + t[0] * o]); }
    return out;
  }
  function sampleF(fn, n) {
    const out = [];
    for (let k = 0; k <= n; k++) { const [s, o] = fn(k / n); const { p, t } = at(PL, LL, s); out.push([p[0] - t[1] * o, p[1] + t[0] * o]); }
    return out;
  }
  // A centerline stretch for masks and strokes: the cord's own vertices
  // between s0 and s1, with the straight runs collapsed to their ends, so its
  // length matches the drawing's exactly.
  function centerline(s0, s1) {
    const pts = [at(PL, LL, s0).p];
    for (let i = 0; i < PL.length; i++) if (LL[i] > s0 + 1e-6 && LL[i] < s1 - 1e-6) pts.push(PL[i]);
    pts.push(at(PL, LL, s1).p);
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const a = out[out.length - 1], b = pts[i], c = pts[i + 1];
      const cross = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 1e-6 || Math.abs(cross) < 1e-6) continue;
      out.push(b);
    }
    out.push(pts[pts.length - 1]);
    return D(out);
  }

  // The square box every variant shares: the centerline's bounds plus half the
  // thickest cord, and a 2% margin.
  const VB = (() => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    PL.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const h = WIDTH.flat / 2; x0 -= h; y0 -= h; x1 += h; y1 += h;
    const side = Math.max(x1 - x0, y1 - y0) * 1.04, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return [cx - side / 2, cy - side / 2, side, side].map((v) => +v.toFixed(3));
  })();

  // ------------------------------------------------------------------ drawing
  // One "stack": everything that makes the cord look like cord, between s0 and
  // s1. Lifted from the approved renderer (cord2.js), unchanged in look.
  function stack(level, col, s0, s1, capStart, capEnd, ext = 0) {
    const w = WIDTH[level], style = LEVEL_STYLE[level];
    s0 = Math.max(0, s0); s1 = Math.min(TOT, s1); if (s1 - s0 < 0.05) return '';
    const t0 = Math.max(0, s0 - ext), t1 = Math.min(TOT, s1 + ext);
    let g = `<path d="${D(sample(s0, s1, 0))}" fill="none" stroke="${col.base}" stroke-width="${w}" stroke-linecap="butt"/>`;
    [[capStart, s0], [capEnd, s1]].forEach(([on, s]) => { if (!on) return; const { p } = at(PL, LL, s); g += `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="${w / 2}" fill="${col.base}"/>`; });
    if (style === 'full' || style === 'mid') {
      const h = w / 2 * 0.9, gIn = w * 0.05, a = w * (style === 'mid' ? 0.9 : 0.6), len = a * 0.6, skew = w * 0.42;
      for (const lane of [1, -1]) {
        const ph = lane === 1 ? 0 : a / 2;
        const k0 = Math.floor((t0 - skew - len - ph) / a) - 1, k1 = Math.ceil((t1 - ph) / a) + 1;
        const lo = Math.max(t0, w * 0.5), hi = Math.min(t1, TOT - w * 0.5);
        const S = (v) => Math.max(lo, Math.min(hi, v));
        for (let k = k0; k <= k1; k++) {
          const s = k * a + ph;
          if (s + len + skew < lo || s > hi) continue;
          const pts = [
            ...sampleF((f) => [S(s + skew * f), lane * (gIn + (h - gIn) * f)], 6),
            ...sampleF((f) => [S(s + skew + len * f), lane * h], 4),
            ...sampleF((f) => [S(s + skew + len - skew * f), lane * (h - (h - gIn) * f)], 6),
            ...sampleF((f) => [S(s + len - len * f), lane * gIn], 4)];
          g += `<path d="${D(pts)}Z" fill="${lane === 1 ? col.cellA : col.cellB}"/>`;
        }
      }
      const e = w * 0.11;
      for (const lane of [1, -1]) g += `<path d="${D(sample(t0, t1, lane * (w / 2 - e / 2)))}" fill="none" stroke="${col.edge}" stroke-width="${e.toFixed(2)}" stroke-linecap="butt"/>`;
    }
    // Fused ends: the melted cap and the ring where the braid stops.
    if (level !== 'mono') {
      const m = w * 0.5;
      [[0, m, true], [TOT - m, TOT, false]].forEach(([a0, a1, isStart]) => {
        const lo = Math.max(s0, a0), hi = Math.min(s1, a1); if (hi - lo < 0.02) return;
        g += `<path d="${D(sample(lo, hi, 0, 0.3))}" fill="none" stroke="${col.melt}" stroke-width="${w}" stroke-linecap="butt"/>`;
        const endS = isStart ? 0 : TOT;
        if (endS >= s0 - 1e-6 && endS <= s1 + 1e-6) { const { p } = at(PL, LL, endS); g += `<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="${w / 2}" fill="${col.melt}"/>`; }
        const ringS = isStart ? a1 : a0;
        if (ringS >= s0 && ringS <= s1) {
          const { p, t } = at(PL, LL, ringS), n = [-t[1], t[0]], hh = w / 2 * 0.98;
          g += `<path d="M${(p[0] + n[0] * hh).toFixed(2)} ${(p[1] + n[1] * hh).toFixed(2)}L${(p[0] - n[0] * hh).toFixed(2)} ${(p[1] - n[1] * hh).toFixed(2)}" stroke="${col.ring}" stroke-width="${(w * 0.1).toFixed(2)}"/>`;
        }
      });
    }
    return g;
  }

  let uid = 0;
  /**
   * The bare mark's drawing, as SVG markup in the shared box (VB). `whole` is
   * the finished mark: the cord, its gap cut away around the stem where the
   * tail passes under (a real hole, so it works on any ground), and the stem
   * drawn over it. `under` is the bowl's second half and the tail alone, with
   * no gap: the drawing animation reveals it under the stem, and cuts the gap
   * itself while the stem is there.
   */
  function markup(level, part = 'whole', colors = COLORS[level === 'mono' ? 'mono' : 'ember']) {
    const w = WIDTH[level];
    if (part === 'under') return stack(level, colors, S_MID, TOT, false, true);
    const id = `pcg${uid++}`;
    const [x, y, s] = VB;
    const halo = `<mask id="${id}" maskUnits="userSpaceOnUse" x="${x}" y="${y}" width="${s}" height="${s}">`
      + `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="#fff"/>`
      + `<path d="${centerline(0, HALO_HI)}" fill="none" stroke="#000" stroke-width="${w + 2 * GAP(w)}" stroke-linecap="round"/></mask>`;
    return `<defs>${halo}</defs><g mask="url(#${id})">${stack(level, colors, 0, TOT, true, true)}</g>`
      + stack(level, colors, 0, HALO_HI + 1.5 * w, true, false, 1.4 * w);
  }

  const svgDoc = (inner, viewBox, size) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox.join(' ')}"${size ? ` width="${size}" height="${size}"` : ''}>${inner}</svg>`;

  function art(level, part = 'whole', size) {
    return svgDoc(markup(level, part), VB, size);
  }

  // CSS linear-gradient(160deg, from, to) on a square of side S, as SVG.
  function tileGradient(id, S) {
    const a = 160 * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a), half = (Math.abs(dx) + Math.abs(dy)) * S / 2;
    const c = S / 2;
    return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${(c - dx * half).toFixed(2)}" y1="${(c - dy * half).toFixed(2)}" x2="${(c + dx * half).toFixed(2)}" y2="${(c + dy * half).toFixed(2)}">`
      + `<stop offset="0" stop-color="${TILE.from}"/><stop offset="1" stop-color="${TILE.to}"/></linearGradient>`;
  }

  // How much of the tile the mark's box fills, by level: the simpler drawings
  // sit larger so they stay legible at dock and tab size.
  const TILE_FILL = { full: 0.7, mid: 0.74, flat: 0.82, mono: 0.82 };
  /**
   * The app icon: the mark on the rounded Ember tile (a 22.5% corner, the
   * tile's own warm-dark gradient and a faint inner edge). `square` drops the
   * rounding and the edge, for platforms that cut their own shape (Apple
   * touch, maskable, iOS), and `fill` overrides how much of it the mark fills.
   */
  function tile(level, { square = false, fill, size = 1024 } = {}) {
    const S = 1024, f = fill ?? TILE_FILL[level], m = S * f, o = (S - m) / 2, r = square ? 0 : S * 0.225;
    const id = `pct${uid++}`;
    let inner = `<defs>${tileGradient(id, S)}</defs><rect width="${S}" height="${S}" rx="${r}" fill="url(#${id})"/>`;
    if (!square) inner += `<rect x="5" y="5" width="${S - 10}" height="${S - 10}" rx="${r - 5}" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="10"/>`;
    inner += `<svg x="${o}" y="${o}" width="${m}" height="${m}" viewBox="${VB.join(' ')}">${markup(level)}</svg>`;
    return svgDoc(inner, [0, 0, S, S], size);
  }

  /** The bare mark, transparent, its box filling `fill` of a 1024 square. */
  function free(level, fill = 1, size = 1024) {
    const S = 1024, m = S * fill, o = (S - m) / 2;
    return svgDoc(`<svg x="${o}" y="${o}" width="${m}" height="${m}" viewBox="${VB.join(' ')}">${markup(level)}</svg>`, [0, 0, S, S], size);
  }

  /**
   * Everything the animation needs, in the box's units. The drawing runs along
   * the centerline from the stem's foot (s = 0) to the tail's end (s = tot):
   * `over` is the stretch from 0 to sMid (stem and the bowl's first half),
   * `under` the rest, and `halo` the stretch of stem whose surroundings are cut
   * from the under strand.
   */
  const GEO = {
    viewBox: VB,
    tot: +TOT.toFixed(3),
    sMid: +S_MID.toFixed(3),
    haloHi: +HALO_HI.toFixed(3),
    cross: { over: +CROSS.sa.toFixed(3), under: +CROSS.sb.toFixed(3) },
    width: WIDTH,
    gap: Object.fromEntries(Object.entries(WIDTH).map(([k, w]) => [k, +GAP(w).toFixed(3)])),
    paths: { over: centerline(0, S_MID), under: centerline(S_MID, TOT), halo: centerline(0, HALO_HI) },
    colors: COLORS,
    tile: TILE,
  };

  window.PCMark = { GEO, art, tile, free, markup };
})();

// Preview when the file is opened directly.
(function () {
  const el = document.getElementById('preview');
  const fig = (svg, label, light) => `<figure class="${light ? 'light' : ''}">${svg}<figcaption>${label}</figcaption></figure>`;
  const sized = (svg, px) => svg.replace('<svg ', `<svg width="${px}" height="${px}" `);
  el.innerHTML = [
    fig(sized(PCMark.art('full'), 420), 'full'),
    fig(sized(PCMark.tile('full'), 160), 'icon'),
    fig(sized(PCMark.tile('mid'), 34), 'dock 34'),
    fig(sized(PCMark.art('mid'), 48), 'mid 48'),
    fig(sized(PCMark.art('mid'), 48), 'mid 48', true),
    fig(sized(PCMark.art('flat'), 16), 'flat 16'),
    fig(sized(PCMark.art('mono'), 18), 'mono 18'),
    fig(sized(PCMark.art('full', 'under'), 160), 'under'),
  ].join('');
  window.DONE = true;
})();
</script>
</body>
</html>
