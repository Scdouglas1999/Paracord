[package]
name = "paracord-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
libc = "0.2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# paracord:// deep links. single-instance is required to deliver links to an
# already-running instance on Linux and Windows (their OS passes the URL as a
# second-process argv, which the single-instance handler forwards).
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# Reads the clipboard for an invite link (lib/clipboardInvite.ts) and clears it
# after a recovery phrase copy (lib/clipboard.ts). Desktop only.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `keyring` has NO default credential store: a build that names no
# platform feature silently gets the in-process *mock* store, whose
# `set_password` returns Ok and whose next `Entry` reads `NoEntry`. That is a
# write-only black hole — it swallowed the refresh token, the encryption
# identity, the Signal sessions and every per-server token — and because it
# never errors, `secureStorage.ts` never reached its encrypted-file fallback.
# The real store per platform is named in the `[target...]` blocks below;
# `secure_store_selftest` (commands.rs) proves at startup that whatever we got
# actually round-trips.
keyring = "3"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"

# Wire types shared with the server (first-run host and trust commands).
paracord-contracts = { workspace = true }
# "Paracord on this computer": the background service, setup and update
# (host.rs).
paracord-hostctl = { path = "../../crates/paracord-hostctl" }
# Native QUIC media engine
paracord-transport = { workspace = true }
paracord-codec = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
# Without a subscriber every `tracing` event in this crate, `paracord-codec`,
# `paracord-transport` and `paracord-relay` is discarded. That is why a client
# log could contain two voice joins and not one line about the microphone.
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
quinn = { workspace = true }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
# Direct rustls handle for the trust-on-first-use certificate-pinning verifier
# wired into reqwest via `use_preconfigured_tls`. Must match reqwest's rustls
# major (0.23) and its `ring` crypto provider so the config downcasts correctly.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# The public certificate authorities the verifier checks a server's chain
# against before it falls back to the trust-on-first-use pin
# (docs/setup-spec.md §7.2). Already in the graph through reqwest's rustls-tls.
webpki-roots = "1"
scap = "0.1.0-beta.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Native camera capture (Media Foundation). Compile-gated arm — unverified on
# the Linux toolchain used here.
nokhwa = { version = "0.10", features = ["input-msmf"] }
wasapi = "0.22"
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # The process's AppUserModelID (app_identity.rs) and the window's rounded
    # corners on Windows 11 (window_chrome.rs).
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Now playing: the system media transport controls (now_playing/gsmtc.rs).
    "Foundation",
    "Media_Control",
    # Native video underlay (native_media/native_render/windows.rs): a
    # DirectComposition tree of Direct3D 11 swapchains under the WebView2,
    # shaders compiled at install with D3DCompile.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# In-process libavcodec GPU codec engine (hardware H.264/AV1 encode + native
# H.264/AV1 decode). Enabled only on Linux/BSD (not macOS, not Windows), which
# keeps those builds — and every server crate, none of which depend on
# paracord-codec — free of the FFmpeg link.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
paracord-codec = { workspace = true, features = ["lavc"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Quiet notifications while sharing a screen with sound (quiet_notify.rs): the
# same notify-rust 4 the notification plugin already uses, for its
# `suppress-sound` hint, which the plugin does not expose.
notify-rust = "4.11"
# Secret Service over pure-Rust zbus (no libdbus headers to install) on the
# async-io reactor, deliberately NOT the `tokio` one: zbus's blocking wrapper
# must not try to block on the ambient Tauri runtime.
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
webkit2gtk = "2.0"
libpulse-binding = "2"
libpulse-simple-binding = "2"
# Native surface rendering (spec §3.3): the webview is reparented into a
# gtk::Overlay and each native-decoded track renders into a gtk::GLArea overlay
# child. These match the versions tao/wry already resolve (gtk 0.18 = GTK3), so
# no new transitive graph is introduced. GL/EGL/CUDA symbols are loaded at
# runtime via libloading (no GL-loader crate exists in the tree).
gtk = "0.18"
gdk = "0.18"
# The main window's wl_surface for frame pacing (linux_frame_clock.rs). tao
# already links it, so this adds nothing to the graph.
gdkwayland-sys = "0.18"
glib = "0.18"
libloading = "0.8"
# Now playing: read MPRIS players on the session bus (now_playing/mpris.rs).
# The same zbus 5 (default features, async-io) tauri-plugin-single-instance and
# notify-rust already pull in, so this adds nothing to the graph.
zbus = "5"
# Native camera capture (V4L2). The `decoding` default feature pulls in the
# MJPEG decoder used by `camera_capture.rs`; `input-v4l` is the pure-Rust ioctl
# backend (no bindgen, unlike the vpx path).
nokhwa = { version = "0.10", features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Native camera capture (AVFoundation). Compile-gated arm — unverified on the
# Linux toolchain used here.
nokhwa = { version = "0.10", features = ["input-avfoundation"] }

[dev-dependencies]
# Certificates and a private CA for the verifier's unit tests.
rcgen = { workspace = true }

[features]
default = ["custom-protocol", "vpx"]
custom-protocol = ["tauri/custom-protocol"]
vpx = ["paracord-codec/vpx"]
