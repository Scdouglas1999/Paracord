<!DOCTYPE html>
<html lang="en" data-theme="slate" data-message-style="bubbles">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http:; connect-src 'self' ipc: http://ipc.localhost ws: wss: http: https:; media-src 'self' data: blob: https: http:"
    />
    <meta name="theme-color" content="#070c10">
    <meta name="description" content="Paracord - a decentralized, self-hostable chat platform">
    <script src="/tauri-sw-cleanup.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-lantern-dim.webp" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-cord.webp" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-lantern.webp" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp" href="/brand/wordmark.webp" fetchpriority="high">
    <title>Paracord</title>
    <!--
      Critical first-paint styles. They are inline, and not in the bundle's CSS,
      because they paint before any script or stylesheet has loaded.

      1. The Slate street (--bg-base of the default theme) and the Onest body
         stack, so the first frame already matches the app shell: no white
         flash, no font swap. The theme attribute is applied by useTheme.ts.

      2. The loading screen (#pc-boot below, and BrandSplash.tsx, which renders
         the same markup in its final frame). Pure CSS, so a cold start animates
         from the very first paint with no script:
           0.05s  the unlit lantern fades up
           0.25s  the braided cord draws itself on: a conic sweep from the left
                  hitch, over the top of the handle, down the tail
           1.00s  the lantern lights: warm bloom, glass brightening, the flame
                  steadying
           1.35s  the "Paracord" wordmark resolves from blur
           2.00s  done. Every animation is finite; nothing moves after this.
         Each layer's resting style IS its final frame; the keyframes only say
         where it starts (fill-mode backwards). So reduced motion, and the
         static React copy, simply switch the animations off.
         lib/bootSplash.ts takes it down the moment the app is ready, even
         mid-sequence; it never holds the app back.
    -->
    <style>
      html, body { background-color: #070c10; }
      body {
        margin: 0;
        color: #f1eee7;
        font-family: 'Onest Variable', 'Onest', -apple-system, BlinkMacSystemFont,
          'Segoe UI', Helvetica, Arial, sans-serif;
      }

      @property --pc-boot-sweep {
        syntax: '<angle>';
        inherits: false;
        initial-value: 360deg;
      }
      .pc-boot {
        /* The art box. The drawing inside it has transparent margins, which
           the negative margins on .pc-boot__art take back. */
        --pc-boot-art: clamp(200px, 42vmin, 320px);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #070c10;
        transition: opacity 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .pc-boot.is-static { z-index: auto; }
      .pc-boot.is-leaving { opacity: 0; pointer-events: none; }
      .pc-boot__stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pc-boot__glow {
        position: absolute;
        left: 50%;
        top: calc(var(--pc-boot-art) * 0.52);
        width: calc(var(--pc-boot-art) * 2.6);
        height: calc(var(--pc-boot-art) * 2.6);
        margin: calc(var(--pc-boot-art) * -1.3) 0 0 calc(var(--pc-boot-art) * -1.3);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 196, 110, 0.24), rgba(255, 160, 70, 0.08) 35%, rgba(255, 160, 70, 0) 65%);
        pointer-events: none;
        animation: pc-boot-bloom 700ms cubic-bezier(0.65, 0, 0.35, 1) 1000ms backwards;
      }
      .pc-boot__art {
        position: relative;
        width: var(--pc-boot-art);
        height: var(--pc-boot-art);
        margin: calc(var(--pc-boot-art) * -0.08) 0 calc(var(--pc-boot-art) * -0.07);
        animation: pc-boot-rise 600ms cubic-bezier(0.2, 0.7, 0.2, 1) 50ms backwards;
      }
      .pc-boot__art > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .pc-boot__lit { animation: pc-boot-in 600ms cubic-bezier(0.65, 0, 0.35, 1) 1000ms backwards; }
      .pc-boot__cord {
        -webkit-mask-image: conic-gradient(from 246deg at 50% 43.5%, #000 0deg, #000 var(--pc-boot-sweep), transparent calc(var(--pc-boot-sweep) + 6deg));
        mask-image: conic-gradient(from 246deg at 50% 43.5%, #000 0deg, #000 var(--pc-boot-sweep), transparent calc(var(--pc-boot-sweep) + 6deg));
        animation: pc-boot-sweep 950ms cubic-bezier(0.65, 0, 0.35, 1) 250ms backwards;
      }
      .pc-boot__flame {
        position: absolute;
        left: 38%;
        top: 50%;
        width: 24%;
        height: 24%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 244, 214, 0.85), rgba(255, 200, 120, 0.3) 45%, rgba(255, 200, 120, 0) 70%);
        opacity: 0;
        pointer-events: none;
        animation: pc-boot-flame 850ms linear 1100ms backwards;
      }
      .pc-boot__word {
        position: relative;
        display: block;
        height: calc(var(--pc-boot-art) * 0.13);
        width: auto;
        animation: pc-boot-word 650ms cubic-bezier(0.16, 1, 0.3, 1) 1350ms backwards;
      }
      .pc-boot__status {
        position: absolute;
        left: 50%;
        top: 100%;
        width: max-content;
        max-width: calc(100vw - 48px);
        margin: 22px 0 0;
        transform: translateX(-50%);
        font-size: 13px;
        line-height: 1.45;
        color: #8d959d;
        text-align: center;
      }
      /* Only if no script ever takes the loading screen down (the bundle failed
         to load): a plain line after 12 s instead of a lantern forever. Hidden,
         not just transparent, until then, so a screen reader does not find it. */
      .pc-boot__slow { visibility: hidden; opacity: 0; animation: pc-boot-late 400ms ease-out 12s forwards; }

      @keyframes pc-boot-rise { from { opacity: 0; transform: translateY(calc(var(--pc-boot-art) * 0.035)); } }
      @keyframes pc-boot-in { from { opacity: 0; } }
      @keyframes pc-boot-late { to { visibility: visible; opacity: 1; } }
      @keyframes pc-boot-bloom { from { opacity: 0; transform: scale(0.6); } }
      @keyframes pc-boot-sweep { from { --pc-boot-sweep: -6deg; } to { --pc-boot-sweep: 300deg; } }
      @keyframes pc-boot-flame {
        0% { opacity: 0; }
        16% { opacity: 0.9; }
        28% { opacity: 0.45; }
        42% { opacity: 0.8; }
        56% { opacity: 0.5; }
        70% { opacity: 0.6; }
        84% { opacity: 0.28; }
        100% { opacity: 0; }
      }
      @keyframes pc-boot-word { from { opacity: 0; filter: blur(10px); transform: scale(1.06); } }

      .pc-boot.is-static,
      .pc-boot.is-static * { animation: none; transition: none; }
      @media (prefers-reduced-motion: reduce) {
        .pc-boot,
        .pc-boot *:not(.pc-boot__slow) { animation: none !important; transition: none !important; }
      }
      html[data-motion='reduced'] .pc-boot,
      html[data-motion='reduced'] .pc-boot *:not(.pc-boot__slow) { animation: none !important; transition: none !important; }
    </style>
  </head>
  <body class="bg-bg-base text-text-primary">
    <div id="root"></div>
    <div id="pc-boot" class="pc-boot">
      <div class="pc-boot__stage">
        <div class="pc-boot__glow"></div>
        <div class="pc-boot__art" aria-hidden="true">
          <img class="pc-boot__dim" src="/brand/splash-lantern-dim.webp" alt="" decoding="async" fetchpriority="high">
          <img class="pc-boot__lit" src="/brand/splash-lantern.webp" alt="" decoding="async" fetchpriority="high">
          <div class="pc-boot__flame"></div>
          <img class="pc-boot__cord" src="/brand/splash-cord.webp" alt="" decoding="async" fetchpriority="high">
        </div>
        <img class="pc-boot__word" src="/brand/wordmark.webp" alt="Paracord" decoding="async" fetchpriority="high">
        <p class="pc-boot__status pc-boot__slow" role="status">
          Paracord is taking longer than usual to start. Reload the window to try again.
        </p>
      </div>
    </div>
    <script src="/boot-window.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
