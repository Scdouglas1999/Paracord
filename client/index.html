    <title>Paracord</title>
    <!--
      Critical first-paint styles. They are inline, and not in the bundle's CSS,
      because they paint before any script or stylesheet has loaded.

      1. The Slate street (--bg-base of the default theme) and the Onest body
         stack, so the first frame already matches the app shell: no white
         flash, no font swap. The theme attribute is applied by useTheme.ts.

      2. The loading screen (#pc-boot below, and BrandSplash.tsx, which renders
         the same markup). Pure CSS, so a cold start animates from the very
         first paint with no script:
           0.06s  the cord draws itself on, about a second, easing out: up the
                  stem, around the bowl, under the stem. The art is static SVG
                  (public/brand/cord-full*.svg); only the dash values of the
                  mask strokes along its centerline move.
           0.70s  the "Paracord" wordmark resolves from blur
           1.12s  done. Every animation is finite; nothing moves after this.
         Each layer's resting style IS its final frame; the keyframes only say
         where it starts (fill-mode backwards). So reduced motion, and the
         static React copy, simply switch the animations off.
         The mark's markup and keyframes are generated by
         client/brand/render.mjs (`code`) between the cord-mark markers.
         lib/bootSplash.ts takes it down the moment the app is ready, even
         mid-sequence; it never holds the app back.
    -->
    <style>
      html, body { background-color: #070c10; }
      body {
        margin: 0;
        color: #f1eee7;
        font-family: 'Onest Variable', 'Onest', -apple-system, BlinkMacSystemFont,
          'Segoe UI', Helvetica, Arial, sans-serif;
      }

      .pc-boot {
        /* The mark's box. */
        --pc-boot-art: clamp(120px, 26vmin, 184px);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #070c10;
        transition: opacity 180ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .pc-boot.is-static { z-index: auto; }
      .pc-boot.is-leaving { opacity: 0; pointer-events: none; }
      .pc-boot__stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pc-boot__glow {
        position: absolute;
        left: 50%;
        top: calc(var(--pc-boot-art) * 0.5);
        width: calc(var(--pc-boot-art) * 3.2);
        height: calc(var(--pc-boot-art) * 3.2);
        margin: calc(var(--pc-boot-art) * -1.6) 0 0 calc(var(--pc-boot-art) * -1.6);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 184, 119, 0.13), rgba(255, 160, 80, 0.04) 38%, rgba(255, 160, 80, 0) 66%);
        pointer-events: none;
        animation: pc-boot-in 600ms cubic-bezier(0.2, 0.7, 0.2, 1) 60ms backwards;
      }
      .pc-boot__art {
        position: relative;
        width: var(--pc-boot-art);
        height: var(--pc-boot-art);
        margin-bottom: calc(var(--pc-boot-art) * 0.16);
      }
      .pc-boot__art > * {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* cord-mark:css:begin */

9;stroke-dashoffset:0}94%{stroke-dasharray:107.01 999;stroke-dashoffset:0}96%{stroke-dasharray:107.04 999;stroke-dashoffset:0}98%{stroke-dasharray:107.05 999;stroke-dashoffset:0}100%{stroke-dasharray:107.05 999;stroke-dashoffset:0}}
@keyframes pc-boot-cord-draw-h{0%{stroke-dasharray:0 999;stroke-dashoffset:0.5}2%{stroke-dasharray:12.06 999;stroke-dashoffset:0}4%{stroke-dasharray:23.64 999;stroke-dashoffset:0}6%{stroke-dasharray:34.75 999;stroke-dashoffset:0}8%{stroke-dasharray:43 999;stroke-dashoffset:0}100%{stroke-dasharray:43 999;stroke-dashoffset:0}}
.pc-boot__o{animation:pc-boot-cord-draw-o 1000ms linear 60ms backwards}
.pc-boot__u{animation:pc-boot-cord-draw-u 1000ms linear 60ms backwards}
.pc-boot__h{animation:pc-boot-cord-draw-h 1000ms linear 60ms backwards}
      /* cord-mark:css:end */
      .pc-boot__word {
        position: relative;
        display: block;
        height: calc(var(--pc-boot-art) * 0.24);
        width: auto;
        animation: pc-boot-word 420ms cubic-bezier(0.16, 1, 0.3, 1) 700ms backwards;
      }
      .pc-boot__status {
        position: absolute;
        left: 50%;
        top: 100%;
        width: max-content;
        max-width: calc(100vw - 48px);
        margin: 22px 0 0;
        transform: translateX(-50%);
        font-size: 13px;
        line-height: 1.45;
        color: #8d959d;
        text-align: center;
      }
      /* Only if no script ever takes the loading screen down (the bundle failed
         to load): a plain line after 12 s instead of a mark forever. Hidden,
         not just transparent, until then, so a screen reader does not find it. */
      .pc-boot__slow { visibility: hidden; opacity: 0; animation: pc-boot-late 400ms ease-out 12s forwards; }

      @keyframes pc-boot-in { from { opacity: 0; } }
      @keyframes pc-boot-late { to { visibility: visible; opacity: 1; } }
      @keyframes pc-boot-word { from { opacity: 0; filter: blur(8px); transform: scale(1.04); } }

      /* The static copy (BrandSplash) holds still, except its own mark, which
         CordMark animates when the app asks it to. */
      .pc-boot.is-static,
      .pc-boot.is-static :not(.pc-cord, .pc-cord *) { animation: none; transition: none; }
      @media (prefers-reduced-motion: reduce) {
        .pc-boot,
        .pc-boot *:not(.pc-boot__slow) { animation: none !important; transition: none !important; }
      }
      html[data-motion='reduced'] .pc-boot,
      html[data-motion='reduced'] .pc-boot *:not(.pc-boot__slow) { animation: none !important; transition: none !important; }
    </style>
  </head>
