<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http:; connect-src 'self' ws: wss: http: https:; media-src 'self' data: blob: https: http:"
    />
    <meta name="theme-color" content="#0d1211">
    <meta name="description" content="Paracord - a decentralized, self-hostable chat platform">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <title>Paracord</title>
    <!--
      Critical first-paint styles: pin the deepest Emerald Commons surface
      (--bg-tertiary #0d1211), the Inter body stack, and the primary text color
      before the app bundle's CSS parses, so the very first frame already matches
      the app shell — no white flash, no font swap. Inline (no external font/CDN
      link) to stay CSP-safe; the runtime theme is re-applied by useTheme.ts.
    -->
    <style>
      html, body { background-color: #0d1211; }
      body {
        margin: 0;
        color: #eaf2ed;
        font-family: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont,
          'Segoe UI', Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body class="bg-bg-tertiary text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
