services:
  paracord:
    build: .
    container_name: paracord
    ports:
      - "8090:8090"
    volumes:
      - paracord-data:/data
    environment:
      # Server
      - PARACORD_BIND_ADDRESS=0.0.0.0:8090
      - PARACORD_SERVER_NAME=localhost
      # - PARACORD_PUBLIC_URL=https://chat.example.com

      # Database
      - PARACORD_DATABASE_URL=sqlite:///data/paracord.db?mode=rwc
      - PARACORD_DATABASE_MAX_CONNECTIONS=20

      # Auth - required; set a strong random secret in .env (see .env.example).
      # The :? form makes `docker compose up` fail fast if it is unset/empty.
      - PARACORD_JWT_SECRET=${PARACORD_JWT_SECRET:?set PARACORD_JWT_SECRET in .env (openssl rand -hex 32)}
      - PARACORD_REGISTRATION_ENABLED=true

      # Storage
      - PARACORD_STORAGE_PATH=/data/uploads
      - PARACORD_MEDIA_STORAGE_PATH=/data/files

      # Backup
      - PARACORD_BACKUP_DIR=/data/backups

      # LiveKit - set if using the optional LiveKit service below
      - PARACORD_LIVEKIT_URL=ws://livekit:7880
      - PARACORD_LIVEKIT_HTTP_URL=http://livekit:7880
      - PARACORD_LIVEKIT_API_KEY=paracordlocal
      # Shared with the livekit service below; both read the SAME variable.
      # Required; set in .env (see .env.example). :? fails fast if unset/empty.
      - PARACORD_LIVEKIT_API_SECRET=${PARACORD_LIVEKIT_API_SECRET:?set PARACORD_LIVEKIT_API_SECRET in .env (openssl rand -hex 32)}
      # - PARACORD_LIVEKIT_PUBLIC_URL=wss://chat.example.com/livekit

      # TLS - disabled inside Docker by default; the container serves plain HTTP
      # on 8090. Terminate TLS at a reverse proxy such as Caddy/nginx (or set
      # PARACORD_TLS_ENABLED=true with mounted certs). Browsers block mic/camera
      # and screen-share on plain HTTP, so voice needs HTTPS in front of this.
      - PARACORD_TLS_ENABLED=false

      # Port forwarding should be configured at your router/firewall layer
    restart: unless-stopped
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.9.11
    container_name: paracord-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      # Same secret as the paracord service above (the key id "paracordlocal"
      # is not a secret). Set PARACORD_LIVEKIT_API_SECRET in .env.
      - "LIVEKIT_KEYS=paracordlocal: ${PARACORD_LIVEKIT_API_SECRET:?set PARACORD_LIVEKIT_API_SECRET in .env (openssl rand -hex 32)}"
    command: --dev --bind 0.0.0.0
    restart: unless-stopped

volumes:
  paracord-data:
