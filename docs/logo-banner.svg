<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Paracord</title>
  <desc id="desc">Paracord interlocking-link mark and wordmark on a warm dark background.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101713"/>
      <stop offset="1" stop-color="#142019"/>
    </linearGradient>
    <linearGradient id="mark" x1="66" y1="53" x2="190" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2bbbad"/>
      <stop offset="1" stop-color="#24d196"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(139 119) rotate(21) scale(250 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24d196" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24d196" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#050806" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="960" height="240" rx="24" fill="url(#panel)"/>
  <rect x=".75" y=".75" width="958.5" height="238.5" rx="23.25" fill="none" stroke="#2b3a31" stroke-width="1.5"/>
  <rect width="420" height="240" rx="24" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="56" y="48" width="144" height="144" rx="40" fill="url(#mark)"/>
    <rect x="82" y="96" width="66" height="54" rx="27" fill="none" stroke="#f7fff9" stroke-width="12" opacity=".96"/>
    <rect x="112" y="96" width="66" height="54" rx="27" fill="none" stroke="#f7fff9" stroke-width="12" opacity=".64"/>
  </g>

  <text x="236" y="122" fill="#f2f5f2" font-family="Fraunces, Georgia, serif" font-size="70" font-weight="700" letter-spacing="-2">Paracord</text>
  <text x="240" y="158" fill="#aebbb2" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" letter-spacing=".3">A home for your people, on your terms.</text>

  <g transform="translate(741 92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 22h22m-11-11v22" stroke="#708078" stroke-width="2"/>
    <path d="M58 13a13 13 0 1 0 0 18m0-18a13 13 0 1 1 0 18" stroke="#24d196" stroke-width="3"/>
    <circle cx="117" cy="22" r="6" fill="#2bbbad" stroke="none"/>
  </g>
</svg>
