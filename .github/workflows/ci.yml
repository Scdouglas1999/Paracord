name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys bundles pre-3.5 CMake policies; CMake 4 on current Windows
  # and macOS runners requires the same compatibility floor as release builds.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  SQLX_OFFLINE: "true"

jobs:
  rust-dependency-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Enforce audit exception review dates
        run: python3 scripts/check_audit_exceptions.py
      - name: Cargo audit
        run: cargo audit

  npm-dependency-audit:
    name: Client Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: npm audit
        working-directory: client
        run: npm ci && npm audit --audit-level=moderate

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [rust-dependency-audit, npm-dependency-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Enforce P0 release gate
        run: python3 scripts/security_gate_check.py

  migration-feature-sanity:
    name: Migration and Feature Sanity
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Migration ordering and apply sanity
        run: python3 scripts/ci_migration_sanity.py
      - name: Release version metadata
        run: python3 scripts/check_release_version.py
      - name: SQLite upgrade from latest release tag
        run: python3 scripts/release_sqlite_upgrade_from_tag_smoke.py v0.9.0
      - name: SQLite query-plan smoke
        run: python3 scripts/release_sqlite_query_plan_smoke.py
      - name: Migration line-ending attributes
        run: python3 scripts/check_migration_line_endings.py
      - name: Python release helper syntax
        run: python3 scripts/check_python_syntax.py
      - name: Shell script syntax
        run: bash -n scripts/setup.sh scripts/backup-db.sh scripts/restore-db.sh scripts/install.sh scripts/ci_install_smoke.sh
      - name: GitHub workflow lint
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/security-audit.yml \
            .github/workflows/security-dast-fuzz.yml
      - name: Cargo check (no-default-features)
        run: cargo check --workspace --no-default-features
      - name: Build client for embedded assets
        working-directory: client
        run: npm ci && npm run build
      - name: Cargo check (default features)
        run: cargo check --workspace

  install-smoke:
    name: Installer Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # End-to-end: lint both installers, package a fake release archive,
      # exercise the local/HTTP/checksum/upgrade paths, and — ubuntu-latest
      # has passwordless sudo and a live systemd — the root path too (a stub
      # paracord binary stands in so no real ports are bound). The script
      # self-skips anything the environment cannot support.
      - name: Installer end-to-end smoke
        run: bash scripts/ci_install_smoke.sh

  rust:
    name: Rust Check
    runs-on: ubuntu-latest
    needs: migration-feature-sanity
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Build client so rust-embed can embed dist/ (needed for default features)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build client
        working-directory: client
        run: npm ci && npm run build
      - name: Verify Rust API schema export
        run: cargo run --locked -p paracord-contracts --bin export-contracts -- --check contracts/api-contracts.json
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build server binary
        run: cargo build --release --bin paracord-server
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Clippy (desktop crate, all targets)
        # The desktop Tauri crate carries native-media test targets that the
        # plain `--workspace` clippy above does not lint (`--all-targets`).
        # Native deps (webkit2gtk, libvpx, ...) are installed on this runner.
        run: cargo clippy -p paracord-desktop --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  postgres:
    name: PostgreSQL Tests
    runs-on: ubuntu-latest
    needs: migration-feature-sanity
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paracord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paracord_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARACORD_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/paracord_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade gate reads migrations from the v0.9.0 tag.
          fetch-depth: 0
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install PostgreSQL Python client
        run: python3 -m pip install psycopg2-binary
      - name: PostgreSQL upgrade from latest release tag
        run: python3 scripts/release_postgres_upgrade_from_tag_smoke.py v0.9.0
      - name: Run PostgreSQL smoke tests (paracord-db)
        run: cargo test -p paracord-db postgres_pool_and_migrations_smoke_when_configured -- --nocapture
      - name: Run PostgreSQL query-plan smoke (paracord-db)
        run: cargo test -p paracord-db postgres_query_plan_smoke_when_configured -- --nocapture
      - name: Run paracord-api PostgreSQL route smoke
        run: cargo test -p paracord-api --test postgres_route_smoke -- --nocapture
      - name: Run the full paracord-api integration suite on PostgreSQL
        # The suite defaults to `sqlite::memory:`, which structurally cannot
        # catch PostgreSQL-only defects — a SQLite-ism in a query, a type the
        # `Any` driver cannot decode, a VARCHAR(n) SQLite ignores and PostgreSQL
        # enforces, an engine split that drifted from its column type. Only the
        # four narrow smokes above ran on PostgreSQL before, and six real
        # PostgreSQL-only failures were sitting behind that gap.
        #
        # With PARACORD_TEST_POSTGRES_URL set, every test provisions its own
        # database cloned from a migrated template, so isolation matches SQLite's
        # and the migration cost is paid once per test binary.
        run: cargo test -p paracord-api --tests --no-fail-fast -- --test-threads=4
      - name: Install database recovery tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 postgresql-client-16 openssl
      - name: SQLite -> PostgreSQL migrator end-to-end
        # Seeds a freshly migrated temp SQLite database, runs
        # `paracord-server migrate-to-postgres` against the live PG service, and
        # asserts every table's row count matches the source. Uses a dedicated
        # throwaway target database so it does not collide with the smoke data
        # loaded above.
        run: python3 scripts/ci_pg_migrator_smoke.py
      - name: Verify isolated SQLite and PostgreSQL archive recovery
        env:
          PARACORD_RESTORE_BINARY: ${{ github.workspace }}/target/debug/paracord-server
        run: python3 scripts/ci_restore_smoke.py

  client:
    name: Client Build
    runs-on: ubuntu-latest
    needs: migration-feature-sanity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Verify generated client API contracts
        working-directory: client
        run: npm run contracts:check
      - name: Type check
        working-directory: client
        run: npm run typecheck
      - name: Lint
        working-directory: client
        run: npm run lint
      - name: Static accessibility audit
        working-directory: client
        run: npm run test:a11y:static
      - name: Contrast audit
        working-directory: client
        run: npm run test:contrast
      - name: Test
        working-directory: client
        run: npm run test --if-present
      - name: Build
        working-directory: client
        run: npm run build

  cross-platform-smoke:
    name: Cross-Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: migration-feature-sanity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Client type check
        working-directory: client
        run: npm run typecheck
      - name: Rust check (no default features)
        run: cargo check --workspace --no-default-features

      # The desktop crate is its own workspace, so `cargo check --workspace`
      # above never reaches it, and the macOS arms of its code (AVFoundation
      # capture, the CoreAnimation render surface, the apple-native keyring)
      # were compiled by nothing at all — `client/src-tauri/Cargo.toml` says as
      # much next to the macOS dependencies. Release builds for macOS now exist,
      # and this keeps them from being the first thing to discover a break.
      - name: Install macOS native dependencies
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          brew update
          brew install libvpx ffmpeg pkg-config speexdsp
          pkg-config --modversion vpx

      - name: Desktop client check (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo check --manifest-path client/src-tauri/Cargo.toml --all-targets

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs:
      - rust
      - client
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paracord
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs:
      - rust
      - client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client for embedded assets
        working-directory: client
        run: npm run build
      - name: Rust coverage (lcov + floor)
        # --fail-under-lines is a ratchet floor (a regression backstop, NOT a target):
        # raise it over time as coverage improves; never lower it to make a red build
        # pass. The value is a conservative initial floor — local measurement was
        # unavailable (cargo-llvm-cov not installed on the dev machine), so it is set
        # below the expected line coverage. Ratchet it up once CI reports the real
        # number in this step's summary output.
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/rust.lcov --fail-under-lines 40
      - name: Client coverage
        working-directory: client
        run: npm run test:unit:coverage -- --reporter=dot
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/rust.lcov
            client/coverage
          if-no-files-found: error

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke test
        working-directory: client
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mocked
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-real-server:
    name: Real-Server E2E Smoke
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      # Build the web UI first so rust-embed bakes the current assets into the
      # release binary that the real-server smoke boots.
      - name: Build client for embedded assets
        working-directory: client
        run: npm run build
      - name: Build release server binary
        run: cargo build --release --bin paracord-server
      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run real-server Playwright smoke test
        working-directory: client
        env:
          PARACORD_E2E_REAL: "1"
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-server
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 7
