name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default: only the job that publishes the release needs to
# write to the repository, and it grants itself `contents: write` locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  LIVEKIT_VERSION: "v1.9.11"
  # libopus (audiopus_sys) bundles a pre-3.5 CMakeLists; CMake 4.x (Windows
  # runner) removed that compatibility. Configure it anyway per CMake's guidance.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # NOTE: the Tauri updater signing key is deliberately NOT declared here. A
  # workflow-level `env` puts the private key in the environment of every step
  # of every job, so any compromised build dependency anywhere in the release
  # (cargo, npm, choco, vcpkg …) could read it and ship signed updates to every
  # user. It is injected only into the single `npx tauri build` step of each
  # client job — the only step that actually signs anything.

jobs:
  validate-release-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            packages/paracord-bot-sdk/package-lock.json

      - name: Check tag matches package versions
        shell: bash
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Enforce audit exception review dates
        shell: bash
        run: python3 scripts/check_audit_exceptions.py

      - name: Audit Rust dependencies
        shell: bash
        run: cargo audit

      - name: Audit client dependencies
        working-directory: client
        shell: bash
        run: npm ci && npm audit --audit-level=moderate

      - name: Audit bot SDK dependencies
        working-directory: packages/paracord-bot-sdk
        shell: bash
        run: npm ci && npm audit --audit-level=moderate

      - name: Check release line endings
        shell: bash
        run: python3 scripts/check_migration_line_endings.py

      - name: Check Python release helper syntax
        shell: bash
        run: python3 scripts/check_python_syntax.py

      - name: Check shell script syntax
        shell: bash
        run: bash -n scripts/setup.sh scripts/backup-db.sh scripts/restore-db.sh

      - name: Lint release workflows
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/security-audit.yml \
            .github/workflows/security-dast-fuzz.yml

  build-server-windows:
    name: Build Server (Windows x64)
    runs-on: windows-latest
    needs: validate-release-version
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build embedded web client
        working-directory: client
        run: npm run build

      - name: Build server binary
        run: cargo build --release --bin paracord-server

      - name: Download LiveKit (Windows)
        shell: pwsh
        run: |
          $version = "${{ env.LIVEKIT_VERSION }}"
          $versionNum = $version.TrimStart("v")
          $url = "https://github.com/livekit/livekit/releases/download/${version}/livekit_${versionNum}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile livekit.zip
          Expand-Archive livekit.zip -DestinationPath livekit-extracted -Force
          $bin = Get-ChildItem -Path livekit-extracted -Recurse -Filter "livekit-server.exe" | Select-Object -First 1
          if (-not $bin) { throw "livekit-server.exe not found in downloaded archive" }
          Copy-Item $bin.FullName target/release/livekit-server.exe -Force

      - name: Package server (Windows)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $pkgDir = "dist/paracord-server"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          Copy-Item target/release/paracord-server.exe "$pkgDir/paracord-server.exe" -Force
          Copy-Item target/release/livekit-server.exe "$pkgDir/livekit-server.exe" -Force
          Copy-Item config/paracord.example.toml "$pkgDir/paracord.example.toml" -Force

          @"
          Paracord Server v${version}
          ========================

          Included binaries:
            - paracord-server.exe
            - livekit-server.exe
          "@ | Out-File -FilePath "$pkgDir/README.txt" -Encoding UTF8

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/paracord-server-windows-x64-${version}.zip" -Force

      - name: Upload server artifact (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: server-windows
          path: dist/paracord-server-windows-x64-*.zip
          if-no-files-found: error

  build-server-linux:
    name: Build Server (Linux x64)
    runs-on: ubuntu-latest
    needs: validate-release-version
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build embedded web client
        working-directory: client
        run: npm run build

      - name: Build server binary
        run: cargo build --release --bin paracord-server

      - name: Download LiveKit (Linux)
        shell: bash
        run: |
          set -euo pipefail
          version="${LIVEKIT_VERSION}"
          version_num="${version#v}"
          url="https://github.com/livekit/livekit/releases/download/${version}/livekit_${version_num}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o livekit.tar.gz
          mkdir -p livekit-extracted
          tar -xzf livekit.tar.gz -C livekit-extracted
          livekit_bin="$(find livekit-extracted -type f -name livekit-server | head -n1)"
          if [ -z "$livekit_bin" ]; then
            echo "livekit-server not found in downloaded archive"
            exit 1
          fi
          cp "$livekit_bin" target/release/livekit-server
          chmod +x target/release/livekit-server

      - name: Package server (Linux)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pkg_dir="dist/paracord-server"
          mkdir -p "$pkg_dir"

          cp target/release/paracord-server "$pkg_dir/paracord-server"
          cp target/release/livekit-server "$pkg_dir/livekit-server"
          cp config/paracord.example.toml "$pkg_dir/paracord.example.toml"

          cat > "$pkg_dir/README.txt" <<EOF
          Paracord Server v${version}
          ========================

          Included binaries:
            - paracord-server
            - livekit-server
          EOF

          tar -czf "dist/paracord-server-linux-x64-${version}.tar.gz" -C dist paracord-server

      - name: Verify LiveKit included in Linux tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Capture the listing before grepping it. `tar … | grep -q` looks
          # right but fails under `set -o pipefail`: grep -q exits the moment it
          # matches, tar then writes to a closed pipe and dies with SIGPIPE
          # (141), and pipefail reports the pipeline as failed even though the
          # file was found. Whether it trips depends on how much tar still had
          # to write when grep left, so it passed while the artifacts were small
          # and started failing as they grew.
          listing="$(tar -tzf "dist/paracord-server-linux-x64-${version}.tar.gz")"
          printf '%s\n' "$listing" | grep -q "livekit-server"

      - name: Upload server artifact (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: server-linux
          path: dist/paracord-server-linux-x64-*.tar.gz
          if-no-files-found: error

  build-server-macos:
    name: Build Server (macOS ${{ matrix.arch }})
    runs-on: macos-14
    needs: validate-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            livekit: darwin_arm64
          - arch: x64
            target: x86_64-apple-darwin
            livekit: darwin_amd64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install native dependencies
        run: |
          set -euo pipefail
          brew update
          brew install libvpx ffmpeg pkg-config speexdsp

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build embedded web client
        working-directory: client
        run: npm run build

      - name: Build server binary
        run: cargo build --release --target ${{ matrix.target }} --bin paracord-server

      # No LiveKit here, on purpose: LiveKit publishes no macOS binary (the step
      # that fetched one could only ever 404), and voice and video run on
      # Paracord's own media engine. The installer already treats the companion
      # as optional.
      - name: Package server artifact (macOS)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/paracord-server" dist/
          chmod +x dist/paracord-server
          tar -czf "dist/paracord-server-macos-${{ matrix.arch }}-${version}.tar.gz" \
            -C dist paracord-server

      - name: Upload server artifact (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: server-macos-${{ matrix.arch }}
          path: dist/paracord-server-macos-*.tar.gz
          if-no-files-found: error

  build-client-macos:
    name: Build Client (macOS ${{ matrix.arch }})
    # Each architecture builds on a runner OF that architecture. The desktop app
    # links libvpx and FFmpeg from Homebrew, and Homebrew installs them for the
    # machine it runs on: cross-compiling the Intel app on an Apple Silicon
    # runner found ARM libraries (and pkg-config refuses to cross-compile at
    # all). The server has no native media libraries, so it cross-compiles fine.
    runs-on: ${{ matrix.runner }}
    # The Intel build is the one macOS package nothing else depends on, and it
    # runs on the rarest runner. If it fails, the release still ships everything
    # else (the release step does not require macOS artifacts) and says nothing
    # false: the Intel .dmg is simply absent from the assets.
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    needs: validate-release-version
    strategy:
      # One failing architecture must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-14
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      # Presence flag only — never the key itself. See build-client-windows.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: client/src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # libvpx is required: VP9 is how screen share and video calls encode, and
      # the `vpx` feature is on by default. Building without it produces a
      # client that silently cannot stream, so it is a dependency, not an
      # optional extra (see CLAUDE.md).
      - name: Install native dependencies
        run: |
          set -euo pipefail
          brew update
          brew install libvpx ffmpeg pkg-config speexdsp
          pkg-config --modversion vpx

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Enable signed updater artifacts
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          node -e "const fs=require('fs'); const p='client/src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.bundle.createUpdaterArtifacts=true; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      # Unsigned by design unless an Apple Developer ID is configured: an
      # unsigned .app still installs, with a one-time right-click → Open (the
      # README says so). Shipping nothing at all is the worse failure, so the
      # notarisation secrets are optional rather than required.
      - name: Build Tauri bundles (macOS)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # A secret that is not configured arrives as an EMPTY variable, not an
          # absent one, and Tauri takes a present APPLE_CERTIFICATE as an
          # instruction to sign — then fails importing nothing into the keychain.
          # Unset what is empty, so "not configured" builds unsigned as intended.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      # The bundler names the updater archive after the product alone
      # (Paracord.app.tar.gz), so the Apple Silicon and Intel archives arrive
      # with one name: the release step refuses two assets with the same name,
      # and the manifest could only have pointed both architectures at one of
      # them. Give each its version and architecture; the signature covers the
      # contents, not the name.
      - name: Name the updater archive after its architecture
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir="target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          archives=("$dir"/*.app.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "expected exactly one updater archive in $dir, found ${#archives[@]}" >&2
            exit 1
          fi
          archive="${archives[0]}"
          named="$dir/$(basename "$archive" .app.tar.gz)_${version}_${{ matrix.arch }}.app.tar.gz"
          mv "$archive" "$named"
          mv "$archive.sig" "$named.sig"
          ls -l "$dir"

      - name: Upload client macOS bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-client-windows:
    name: Build Client (Windows x64)
    runs-on: windows-latest
    needs: validate-release-version
    env:
      # Presence flag only — never the key itself. Steps that merely need to
      # know whether signing is configured read this; the key material stays
      # scoped to the build step below.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Actions are pinned to commit SHAs in the jobs that hold the signing key:
      # a moved tag would otherwise be enough to run attacker code beside it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install libvpx for native media
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }

          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg.exe not found at $vcpkg"
          }

          & $vcpkg install libvpx:x64-windows-static

          $installed = Join-Path $vcpkgRoot "installed\x64-windows-static"
          "VPX_LIB_DIR=$installed\lib" >> $env:GITHUB_ENV
          "VPX_INCLUDE_DIR=$installed\include" >> $env:GITHUB_ENV
          "VPX_VERSION=1.16.0" >> $env:GITHUB_ENV
          "VPX_STATIC=1" >> $env:GITHUB_ENV

          # env-libvpx-sys emits `rustc-link-lib=static=libvpx` on Windows, so
          # rustc looks for libvpx.lib; the vcpkg x64-windows-static triplet
          # names the archive vpx.lib. Provide a libvpx.lib alias so the static
          # link resolves.
          $libFile = Join-Path $installed "lib\vpx.lib"
          $aliasFile = Join-Path $installed "lib\libvpx.lib"
          if ((Test-Path $libFile) -and -not (Test-Path $aliasFile)) {
            Copy-Item $libFile $aliasFile
          }

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Enable signed updater artifacts
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p='client/src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.bundle.createUpdaterArtifacts=true; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      - name: Build Tauri bundles (Windows)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $roots = @(
            [Environment]::GetFolderPath("ProgramFilesX86"),
            [Environment]::GetFolderPath("ProgramFiles")
          ) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $roots |
            ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          "ISCC_EXE=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build Inno installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "$env:ISCC_EXE" /DAppVersion=$version installer/paracord-client.iss

      - name: Upload client installer (Inno)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-windows-installer
          path: installer/output/Paracord-Setup-*.exe
          if-no-files-found: error

      - name: Upload client MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-windows-msi
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  build-client-linux:
    name: Build Client (Linux x64)
    runs-on: ubuntu-latest
    needs: validate-release-version
    env:
      # Presence flag only — never the key itself. See build-client-windows.
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Actions are pinned to commit SHAs in the jobs that hold the signing key:
      # a moved tag would otherwise be enough to run attacker code beside it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libvpx-dev \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpulse-dev \
            libspeexdsp-dev
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libayatana-appindicator3-dev
          else
            sudo apt-get install -y libappindicator3-dev
          fi

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.91"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Enable signed updater artifacts
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          node -e "const fs=require('fs'); const p='client/src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.bundle.createUpdaterArtifacts=true; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

      - name: Build Tauri bundles (AppImage + deb)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles appimage,deb,rpm

      # linuxdeploy bundles the runner's libwayland, which is older than the one
      # a current Mesa is built against; loaded first, it keeps the host's
      # libEGL_mesa from loading and WebKit aborts before the window opens.
      # The script takes those libraries out, repacks, and re-signs the AppImage.
      - name: Use the host's Wayland libraries in the AppImage
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          appimages=(../target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${#appimages[@]}: ${appimages[*]}" >&2
            exit 1
          fi
          bash scripts/finalize-appimage.sh "${appimages[0]}"

      - name: Upload client AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Upload client deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-linux-deb
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
          if-no-files-found: error

      - name: Upload client rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-linux-rpm
          path: |
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-server-windows
      - build-server-linux
      - build-server-macos
      - build-client-windows
      - build-client-linux
      - build-client-macos
    runs-on: ubuntu-latest
    # The only job that mutates the repository: it deletes stale release assets
    # and publishes the new ones.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE_NOTES.md
            scripts/generate_updater_manifest.py
          sparse-checkout-cone-mode: false
          # Check out into a subdirectory so this checkout cannot wipe the
          # already-downloaded `artifacts/` directory in the workspace root.
          path: _release_src

      # The manifest logic lives in a script so the exact file a release
      # publishes can be produced and checked locally from signed test files.
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          python3 _release_src/scripts/generate_updater_manifest.py \
            --artifacts artifacts \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --out artifacts/latest.json

      - name: Build release body from RELEASE_NOTES.md
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _release_src/RELEASE_NOTES.md ]; then
            cp _release_src/RELEASE_NOTES.md artifacts/body.md
          else
            echo "## Release ${GITHUB_REF_NAME}" > artifacts/body.md
          fi

          cat >> artifacts/body.md <<'DOWNLOADS'

          ---

          ## Downloads

          | Component | File |
          |-----------|------|
          | Server (Windows x64) | `paracord-server-windows-x64-*.zip` |
          | Server (Linux x64) | `paracord-server-linux-x64-*.tar.gz` |
          | Client Installer (Windows) | `Paracord-Setup-*.exe` |
          | Client MSI (Windows) | `Paracord_*_x64_en-US.msi` |
          | Client AppImage (Linux) | `Paracord_*_amd64.AppImage` |
          | Client deb (Linux) | `Paracord_*_amd64.deb` |
          | Client rpm (Fedora/RHEL) | `Paracord-*-1.x86_64.rpm` |
          | Client (macOS, Apple Silicon) | `Paracord_*_aarch64.dmg` |
          | Client (macOS, Intel) | `Paracord_*_x64.dmg` |
          | Server (macOS) | `paracord-server-macos-*.tar.gz` |
          | Signed updater manifest, when signing artifacts are configured | `latest.json` |
          | SHA-256 checksums of every file above | `SHA256SUMS.txt` |

          ### Check a download

          Put `SHA256SUMS.txt` in the same folder as the file you downloaded, then:

          - Linux: `sha256sum --ignore-missing -c SHA256SUMS.txt`
          - macOS: `shasum -a 256 --ignore-missing -c SHA256SUMS.txt`
          - Windows (PowerShell): `(Get-FileHash .\<file>).Hash` and compare it with that
            file's line in `SHA256SUMS.txt`

          The install scripts do this check themselves and refuse a file that does not match.
          DOWNLOADS

      - name: Verify required release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          required_patterns=(
            "artifacts/server-windows/*.zip"
            "artifacts/server-linux/*.tar.gz"
            "artifacts/client-windows-installer/*.exe"
            "artifacts/client-windows-msi/*.msi"
            "artifacts/client-linux-appimage/*.AppImage"
            "artifacts/client-linux-deb/*.deb"
            "artifacts/body.md"
          )
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "Missing required release artifact: $pattern" >&2
              exit 1
            fi
          done

      # Every file the release publishes is copied into one folder first, and
      # SHA256SUMS.txt is computed over exactly that folder, so the checksums
      # can never cover a different set of files than the release attaches.
      - name: Gather release assets and write SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          patterns=(
            "artifacts/server-windows/*.zip"
            "artifacts/server-linux/*.tar.gz"
            "artifacts/client-windows-installer/*.exe"
            "artifacts/client-windows-msi/*.msi"
            "artifacts/client-windows-msi/*.msi.sig"
            "artifacts/client-linux-appimage/*.AppImage"
            "artifacts/client-linux-appimage/*.AppImage.sig"
            "artifacts/client-linux-deb/*.deb"
            "artifacts/client-linux-deb/*.deb.sig"
            "artifacts/client-linux-rpm/*.rpm"
            "artifacts/client-linux-rpm/*.rpm.sig"
            "artifacts/server-macos-arm64/*.tar.gz"
            "artifacts/server-macos-x64/*.tar.gz"
            "artifacts/client-macos-aarch64/dmg/*.dmg"
            "artifacts/client-macos-aarch64/macos/*.app.tar.gz"
            "artifacts/client-macos-aarch64/macos/*.app.tar.gz.sig"
            "artifacts/client-macos-x86_64/dmg/*.dmg"
            "artifacts/client-macos-x86_64/macos/*.app.tar.gz"
            "artifacts/client-macos-x86_64/macos/*.app.tar.gz.sig"
            # Only produced when an updater signing key is configured; a
            # bracket glob so nullglob drops it when it was not generated.
            "artifacts/latest[.]json"
          )
          for pattern in "${patterns[@]}"; do
            for file in $pattern; do
              name="$(basename "$file")"
              # Release assets are flat: two files with one name would publish
              # only one of them, and the checksum list would lie about which.
              if [ -e "release-assets/$name" ]; then
                echo "Two release files are both named $name" >&2
                exit 1
              fi
              cp "$file" "release-assets/$name"
            done
          done
          cd release-assets
          # Bare file names, one per line, in the format `sha256sum -c` reads.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Delete existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Delete all existing assets so we don't accumulate stale files from prior runs
          asset_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].id' 2>/dev/null || true)"
          for aid in $asset_ids; do
            echo "Deleting asset $aid"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" || true
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Releases are created as DRAFTS: every artifact is built and attached,
          # but nothing is public (and `latest.json` reaches no updater) until a
          # maintainer has installed and tested the builds and publishes it by
          # hand from the GitHub Releases page.
          draft: true
          body_path: artifacts/body.md
          # Everything, including SHA256SUMS.txt, was gathered by the step
          # above; the checksums cover exactly this set.
          fail_on_unmatched_files: true
          files: |
            release-assets/*
