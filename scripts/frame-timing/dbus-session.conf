<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The private session bus of a frame-timing run. Unlike the stock session
     config it lists no service directories, so nothing is ever activated on it:
     a Secret Service request from the app finds no ksecretd/gnome-keyring
     (which would start with the real HOME and outlive the run), and no portal
     starts. Clients on the bus (KWin, the app) still talk to each other. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
